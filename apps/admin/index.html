<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>لوحة إدارة أثر</title>
  <link rel="stylesheet" href="admin.css?v=33">
</head>
<body>
  <div id="login-view" class="login-shell">
    <section class="login-brand">
      <div class="brand-mark">أثر</div>
      <span class="eyebrow">ATHR ADMIN</span>
      <h1>إدارة المتجر من مكان واحد.</h1>
      <p>المنتجات، المستخدمون، الطلبات، والاشتراكات في لوحة مستقلة عن واجهة العملاء.</p>
    </section>

    <section class="login-card">
      <div>
        <span class="eyebrow">دخول الإدارة</span>
        <h2>مرحبًا بك</h2>
      </div>
      <form id="login-form">
        <label>البريد الإلكتروني<input id="login-email" type="email" autocomplete="username" required placeholder="admin@athar-online.com"></label>
        <label>كلمة المرور<input id="login-password" type="password" autocomplete="current-password" required placeholder="••••••••••••"></label>
        <div id="login-error" class="form-error" role="alert"></div>
        <button id="login-submit" class="primary" type="submit">تسجيل الدخول</button>
      </form>
    </section>
  </div>

  <div id="admin-view" class="admin-shell" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-mark small">أثر</span><div><b>لوحة الإدارة</b><small>ATHR ADMIN</small></div></div>
      <nav id="admin-nav">
        <button class="nav-item active" data-view="overview">نظرة عامة</button>
        <button class="nav-item" data-view="products">المنتجات</button>
        <button class="nav-item" data-view="categories">التصنيفات</button>
        <button class="nav-item" data-view="users">المستخدمون</button>
        <button class="nav-item" data-view="newsletter">النشرة البريدية</button>
        <button class="nav-item" data-view="orders">الطلبات</button>
      </nav>
      <button id="logout-btn" class="logout-btn">تسجيل الخروج</button>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <button id="menu-btn" class="menu-btn" aria-label="القائمة">☰</button>
        <div><small>لوحة إدارة أثر</small><h1 id="page-title">نظرة عامة</h1></div>
        <div class="admin-profile"><div><b id="admin-name">—</b><small id="admin-role">—</small></div><span class="avatar">أ</span></div>
      </header>
      <div id="content" class="content"><div class="loading">جارٍ تحميل لوحة الإدارة…</div></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="admin.js?v=33"></script>
</body>
</html>
